# Configuración de AWS SAM para el workshop.
#
# Este archivo existe para que 'sam deploy' funcione sin preguntas y sin
# 'sam deploy --guided'. Si quieres ver qué preguntaría, ejecuta el modo
# guiado en una copia del repo: sobrescribe este archivo.

version = 0.1

[default.global.parameters]
stack_name = "safe-space"

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
region = "us-east-1"
capabilities = "CAPABILITY_IAM"
# SAM crea y reutiliza un bucket propio para los artefactos del deploy.
resolve_s3 = true
confirm_changeset = false
fail_on_empty_changeset = false
tags = "project=safe-space workshop=awspectrum-latam"

# Aquí NO va `parameter_overrides` con la taxonomía. La plantilla declara que
# sus `Default` son la única fuente de verdad, y repetirlos en este archivo
# crea una segunda copia que gana en silencio: quien edite template.yaml
# siguiendo esa instrucción vería que su cambio no surte efecto.
# Para probar otra taxonomía sin tocar la plantilla, pásala en la línea:
#     sam deploy --parameter-overrides AllowedServices=...

[default.sync.parameters]
# 'sam sync --code' sube sólo el código de las Lambdas, sin rehacer la
# infraestructura. Es lo que usarás durante la fase de experimentación.
watch = false
# Nuestras Lambdas no tienen dependencias externas, así que no hay ninguna capa
# que sincronizar. Sin esto, sam sync avisa de una capa que nunca existió.
dependency_layer = false

[default.delete.parameters]
no_prompts = true
